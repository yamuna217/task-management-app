<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Management App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div id="loginView" class="auth-card">
        <div class="auth-header">
          <h2>Welcome Back</h2>
          <p>Login to manage your tasks</p>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="form-group">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="loginPassword">Password</label>
            <input id="loginPassword" name="password" type="password" placeholder="Enter your password" required />
          </div>

          <button type="submit" class="btn btn-primary">Login</button>
        </form>

        <div class="form-switch">
          Need an account?
          <button id="showRegisterBtn" type="button">Register</button>
        </div>

        <div id="loginMessage" class="message"></div>
      </div>

      <div id="registerView" class="auth-card hidden">
        <div class="auth-header">
          <h2>Create Account</h2>
          <p>Register to start organizing your work</p>
        </div>

        <form id="registerForm" class="auth-form">
          <div class="form-group">
            <label for="registerName">Name</label>
            <input id="registerName" name="name" type="text" placeholder="Your name" required />
          </div>

          <div class="form-group">
            <label for="registerEmail">Email</label>
            <input id="registerEmail" name="email" type="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="registerPassword">Password</label>
            <input id="registerPassword" name="password" type="password" placeholder="Create a password" required />
          </div>

          <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div class="form-switch">
          Already have an account?
          <button id="showLoginBtn" type="button">Login</button>
        </div>

        <div id="registerMessage" class="message"></div>
      </div>

      <div id="dashboardView" class="dashboard-card hidden">
        <div class="dashboard-header">
          <h2>Task Dashboard</h2>
          <div class="user-badge">
            <span>👤</span>
            <span id="userName">User</span>
          </div>
          <button id="logoutBtn" type="button" class="btn btn-ghost">Logout</button>
        </div>

        <div class="dashboard-layout">
          <aside class="task-panel">
            <h3 id="taskFormTitle">Add Task</h3>

            <form id="taskForm" class="task-form">
              <div class="form-group">
                <label for="taskTitle">Title</label>
                <input id="taskTitle" name="title" type="text" placeholder="Enter task title" required />
              </div>

              <div class="form-group">
                <label for="taskDescription">Description</label>
                <textarea id="taskDescription" name="description" placeholder="Add details for this task"></textarea>
              </div>

              <div class="form-group">
                <label for="taskStatus">Status</label>
                <select id="taskStatus" name="status">
                  <option value="pending">pending</option>
                  <option value="in-progress">in-progress</option>
                  <option value="completed">completed</option>
                </select>
              </div>

              <div class="form-group">
                <label for="taskPriority">Priority</label>
                <select id="taskPriority" name="priority">
                  <option value="low">low</option>
                  <option value="medium" selected>medium</option>
                  <option value="high">high</option>
                </select>
              </div>

              <div class="form-group">
                <label for="taskDueDate">Due Date</label>
                <input id="taskDueDate" name="dueDate" type="date" />
              </div>

              <button id="taskSubmitBtn" type="submit" class="btn btn-primary">Add Task</button>
            </form>
          </aside>

          <section class="list-panel">
            <h3>Your Tasks</h3>
            <div id="dashboardMessage" class="message"></div>
            <div id="taskList" class="task-list"></div>
          </section>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
